[project]
name = "dispatch"
version = "0.1.0"
description = "Read-only terminal dashboard for RPM update discovery over SSH"
readme = "README.md"
authors = [
    { name = "Whose Footprints", email = "huh.whose.footprints.are.these@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.24.0",
    "textual>=8.2.8",
]

[project.scripts]
dispatch = "dispatch:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-textual-snapshot>=1.0.0",
]
